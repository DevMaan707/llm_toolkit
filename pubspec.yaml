name: llm_toolkit
description: "On-device AI toolkit for Flutter: LLM chat (GGUF via llama.cpp, LiteRT-LM), vision, Whisper speech recognition, embeddings and RAG, Hugging Face/Ollama model discovery and resumable downloads, structured output and tool calling."
version: 0.1.1
homepage: https://github.com/DevMaan707/llm_toolkit
repository: https://github.com/DevMaan707/llm_toolkit
issue_tracker: https://github.com/DevMaan707/llm_toolkit/issues
topics:
  - llm
  - on-device-ai
  - speech-recognition
  - rag
  - llama-cpp

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Inference engines
  llama_cpp_dart: ^0.2.2
  flutter_edge_ai: ^2.3.1
  flutter_edge_ai_litertlm: ^1.13.1
  tflite_flutter: ^0.12.1
  sherpa_onnx: ^1.13.8

  # Audio
  record: ^7.1.2
  fftea: ^1.0.0

  # Networking, storage and utilities
  dio: ^5.8.0
  http: ^1.5.0
  path_provider: ^2.1.1
  path: ^1.8.3
  crypto: ^3.0.3
  collection: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
